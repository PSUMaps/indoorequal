tileset:
  layers:
    - layers/area_name/area_name.yaml
    - layers/area/area.yaml
    - layers/transportation/transportation.yaml
    - layers/poi/poi.yaml
    - layers/heat/heat.yaml
    - layers/building_area/area.yaml
    - layers/building_area_name/area_name.yaml
  name: indoor=
  version: 0.4.0
  id: indoorequal
  description: "Generate vector tiles from OpenStreetMap indoor data"
  attribution: '<a href="https://indoorequal.org/" target="_blank">&copy; indoor=</a> <a href="https://www.openmaptiles.org/" target="_blank">&copy; OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>'
  center: [-12.2168, 28.6135, 4]
  bounds: [-180.0,-85.0511,180.0,85.0511]
  maxzoom: 17
  minzoom: 0
  pixel_scale: 256
  languages:
    - en # English, Latin
    - ru # Russian
  defaults:
    srs: +proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0.0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs +over
    datasource:
      srid: 900913
